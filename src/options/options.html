<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | YouTube Photo Comments</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: #121212;
        color: #f5f5f5;
      }
      .box {
        max-width: 700px;
        margin: 0 auto;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 24px;
      }
      h1 { margin-top: 0; }
      p { color: #d0d0d0; }
      .pill {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff2d55, #ff9f43);
        color: #fff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>YouTube Photo Comments</h1>
      <p>Extension is active on YouTube pages.</p>
      <p>Use the Photo button in the comment field to attach images and show inline photo comments.</p>
      <div class="pill">TikTok-like comment photo mode</div>
    </div>
  </body>
</html>
